# ---------------------------------------------------------------------------
# Workspace-level Cargo configuration
# ---------------------------------------------------------------------------

# Android test runner — used by the android-emulator CI workflow.
# When `ANDROID_EMULATOR_RUNNING=1` is set, cargo-test binaries are pushed
# to the emulator via adb and executed there instead of running locally.
#
# The script target/android_test_runner.sh is generated by the CI workflow.
[target.x86_64-linux-android]
runner = "target/android_test_runner.sh"

[target.aarch64-linux-android]
runner = "target/android_test_runner.sh"
