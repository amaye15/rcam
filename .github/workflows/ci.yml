name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # -------------------------------------------------------------------------
  # Linux — V4L2 backend
  # -------------------------------------------------------------------------
  linux:
    name: Linux (V4L2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Check (Linux)
        run: cargo check -p rcam

      - name: Build (Linux)
        run: cargo build -p rcam

      - name: Run mock + error tests
        run: cargo test -p rcam --test mock_camera --test error_display

      - name: Run optional-feature tests
        run: cargo test -p rcam --test image_output --test serde_roundtrips --features serde,image-output

      # Load v4l2loopback and run the ignored V4L2 device smoke tests.
      - name: Install v4l2loopback
        continue-on-error: true  # modprobe can fail on Azure kernel; tests self-skip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends v4l2loopback-dkms
          sudo modprobe v4l2loopback devices=1 video_nr=0 \
            card_label="Virtual Camera" exclusive_caps=1
          ls /dev/video* || echo "no video device; tests will self-skip"

      - name: Run V4L2 device smoke tests
        run: cargo test -p rcam --test v4l2_device -- --include-ignored
        continue-on-error: true  # fails gracefully if module load failed

      - name: Clippy (Linux)
        run: cargo clippy -p rcam -- -D warnings

      - name: Clippy (optional features)
        run: cargo clippy -p rcam --features serde,image-output -- -D warnings

  # -------------------------------------------------------------------------
  # macOS — AVFoundation backend
  # -------------------------------------------------------------------------
  macos:
    name: macOS (AVFoundation)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Check (macOS)
        run: cargo check -p rcam

      - name: Build (macOS)
        run: cargo build -p rcam

      - name: Run mock + error tests
        run: cargo test -p rcam --test mock_camera --test error_display

      - name: Run optional-feature tests
        run: cargo test -p rcam --test image_output --test serde_roundtrips --features serde,image-output

      - name: Clippy (macOS)
        run: cargo clippy -p rcam -- -D warnings

  # -------------------------------------------------------------------------
  # Windows — Media Foundation backend
  # -------------------------------------------------------------------------
  windows:
    name: Windows (Media Foundation)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Check (Windows)
        run: cargo check -p rcam

      - name: Build (Windows)
        run: cargo build -p rcam

      - name: Run mock + error tests
        run: cargo test -p rcam --test mock_camera --test error_display

      - name: Run optional-feature tests
        run: cargo test -p rcam --test image_output --test serde_roundtrips --features serde,image-output

      - name: Clippy (Windows)
        run: cargo clippy -p rcam -- -D warnings

  # -------------------------------------------------------------------------
  # WASM — Web backend
  # -------------------------------------------------------------------------
  wasm:
    name: WASM (Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Check (WASM)
        run: cargo check -p rcam --target wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install Chrome (for headless browser tests)
        uses: browser-actions/setup-chrome@v1

      - name: Run WASM tests in headless Chrome
        # Use `-- --test wasm_tests` so cargo only compiles the wasm_tests
        # integration test and the library, not the native-only examples.
        run: wasm-pack test --headless --chrome rcam/ -- --test wasm_tests

  # -------------------------------------------------------------------------
  # Android — Camera2 NDK (check only in main CI; emulator job is separate)
  # -------------------------------------------------------------------------
  android:
    name: Android (Camera2 NDK — compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Check rcam (aarch64)
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo check -p rcam --target aarch64-linux-android

      - name: Check rcam (armv7)
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo check -p rcam --target armv7-linux-androideabi

      - name: Check rcam-sys-android (aarch64)
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo check -p rcam-sys-android --target aarch64-linux-android

  # -------------------------------------------------------------------------
  # Format + doc check (fast, runs on ubuntu)
  # -------------------------------------------------------------------------
  fmt-and-doc:
    name: Format & Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build docs (rcam)
        run: cargo doc -p rcam --no-deps

      - name: Build docs (with optional features)
        run: cargo doc -p rcam --no-deps --features serde,image-output
