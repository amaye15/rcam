# Credentials are read from BROWSERSTACK_USERNAME / BROWSERSTACK_ACCESS_KEY env vars.
# Do not hardcode them here.

projectName: rcam
buildName: rcam-ci

browsersAndDevices:
  - browser: chrome
    browserVersion: latest
    os: Windows
    osVersion: 11
  - browser: firefox
    browserVersion: latest
    os: Windows
    osVersion: 11
  - browser: safari
    browserVersion: latest
    os: OS X
    osVersion: Sonoma
  - deviceName: Samsung Galaxy S23
    osVersion: 13.0
    browserName: chrome
    deviceOrientation: portrait
  - deviceName: iPhone 14
    osVersion: 16
    browserName: safari
    deviceOrientation: portrait

parallelsPerPlatform: 1
browserstackLocal: true

# Playwright config passed to the SDK — baseURL must live here so the SDK
# can inject it into the remotely launched browser context.
playwrightConfigOptions:
  use:
    baseURL: 'http://localhost:8080'
    timeout: 30000
