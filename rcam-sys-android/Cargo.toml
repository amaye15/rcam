[package]
name = "rcam-sys-android"
version.workspace = true
edition.workspace = true
description = "Raw Camera2 NDK + AMediaRecorder sys bindings for Android (hand-written FFI; optional bindgen regeneration)"
keywords = ["android", "camera", "camera2", "ndk", "sys"]
categories = ["external-ffi-bindings", "hardware-support"]
readme = "README.md"
license.workspace = true
repository.workspace = true

[lib]
# This crate is only usable on Android; build.rs exits early on other targets.

[build-dependencies]
bindgen = { version = "0.70", optional = true }

[features]
# Enable to regenerate bindings from NDK headers. Requires ANDROID_NDK_ROOT.
bindgen = ["dep:bindgen"]
