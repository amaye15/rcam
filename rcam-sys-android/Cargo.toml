[package]
name = "rcam-sys-android"
version.workspace = true
edition.workspace = true
description = "Raw Camera2 NDK sys bindings for Android (generated by bindgen)"
license.workspace = true
repository.workspace = true

[lib]
# This crate is only usable on Android; build.rs exits early on other targets.

[build-dependencies]
bindgen = { version = "0.70", optional = true }

[features]
# Enable to regenerate bindings from NDK headers. Requires ANDROID_NDK_ROOT.
bindgen = ["dep:bindgen"]
