[package]
name = "rcam"
version.workspace = true
edition.workspace = true
description = "Cross-platform camera capture and video recording for iOS, macOS, Android, Linux, Windows, and WASM"
license.workspace = true
repository.workspace = true
keywords = ["camera", "video", "capture", "cross-platform", "wasm"]
categories = ["multimedia::video", "hardware-support"]
readme = "README.md"

# ---------------------------------------------------------------------------
# Features — backend-* are organisational markers; platform deps are always
# compiled for the matching target (same pattern as cpal / winit).
# ---------------------------------------------------------------------------
[features]
default = []

backend-avfoundation = []
backend-android      = []
backend-v4l2         = []
backend-mf           = []
backend-web          = []

# Optional capabilities
ffmpeg-encoding = ["dep:ffmpeg-next"]
serde           = ["dep:serde"]
image-output    = ["dep:image"]

# ---------------------------------------------------------------------------
# Cross-platform dependencies
# ---------------------------------------------------------------------------
[dependencies]
async-trait = { workspace = true }
thiserror   = { workspace = true }
tokio       = { version = "1", features = ["sync", "rt"] }

serde       = { version = "1", features = ["derive"], optional = true }
image       = { version = "0.25", optional = true }
ffmpeg-next = { version = "7", optional = true }

# ---------------------------------------------------------------------------
# macOS + iOS — AVFoundation
# ---------------------------------------------------------------------------
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-av-foundation = { version = "0.3", features = [
    "AVCaptureSession",
    "AVCaptureDevice",
    "AVCaptureInput",          # base class; includes AVCaptureDeviceInput
    "AVCaptureOutputBase",     # base class; includes AVCaptureOutput
    "AVCaptureVideoDataOutput",
    "AVCapturePhotoOutput",
    "AVAssetWriter",
    "AVAssetWriterInput",
    "AVCaptureFileOutput",     # includes AVCaptureMovieFileOutput + recording delegate
    "AVMediaFormat",           # AVMediaType, AVMediaTypeVideo
    "dispatch2",               # enables setSampleBufferDelegate:queue:
]}
objc2-foundation = "0.3"
objc2-core-media = { version = "0.3", features = [
    "objc2-core-video",        # enables CMSampleBuffer::image_buffer()
]}
objc2-core-video = { version = "0.3", features = [
    "CVBase",                  # CVPixelBufferLockFlags bitflags
    "CVBuffer",                # CVBuffer struct
    "CVImageBuffer",           # CVImageBuffer type alias
    "CVReturn",                # CVReturn for lock/unlock return value
    "CVPixelBuffer",           # CVPixelBuffer type alias + functions
]}

# ---------------------------------------------------------------------------
# Android — Camera2 NDK
# ---------------------------------------------------------------------------
[target.'cfg(target_os = "android")'.dependencies]
rcam-sys-android = { path = "../rcam-sys-android" }
jni = "0.21"

# ---------------------------------------------------------------------------
# Linux — V4L2
# ---------------------------------------------------------------------------
[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"

# ---------------------------------------------------------------------------
# Windows — Media Foundation
# ---------------------------------------------------------------------------
[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.58"
features = [
    "Foundation",
    "Foundation_Collections",
    "Devices_Enumeration",
    "Media_Capture",
    "Media_MediaProperties",
    "Storage",
    "Storage_Streams",
]

# ---------------------------------------------------------------------------
# WASM — Web APIs
# ---------------------------------------------------------------------------
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
js-sys               = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    # Devices / permissions
    "MediaDevices",
    "MediaDeviceInfo",
    "InputDeviceInfo",
    "MediaStream",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "MediaTrackConstraints",
    # Recording
    "MediaRecorder",
    "MediaRecorderOptions",
    "BlobEvent",
    "Blob",
    # Still capture
    "ImageCapture",
    # Frame capture via canvas
    "Navigator",
    "Window",
    "Document",
    "Element",
    "EventTarget",
    "HtmlMediaElement",
    "HtmlVideoElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
]

[dev-dependencies]
tokio        = { version = "1", features = ["full"] }
serde_json   = "1"
# WASM-only test harness (inactive on native targets).
wasm-bindgen-test = "0.3"

# ---------------------------------------------------------------------------
# Named test targets — some require optional features to compile.
# ---------------------------------------------------------------------------

[[test]]
name = "mock_camera"

[[test]]
name = "error_display"

[[test]]
name = "image_output"
required-features = ["image-output"]

[[test]]
name = "serde_roundtrips"
required-features = ["serde"]

# wasm_tests: compiled only when targeting wasm32 (file uses #![cfg(target_arch = "wasm32")]).
[[test]]
name = "wasm_tests"

# v4l2_device: compiled only on Linux (file uses #![cfg(target_os = "linux")]).
[[test]]
name = "v4l2_device"

[[example]]
name = "list_devices"

[[example]]
name = "snapshot"

[[example]]
name = "record"
